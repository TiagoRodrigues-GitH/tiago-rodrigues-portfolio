name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DIST: dist/tiago-rodrigues-portfolio/browser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false

      # The base href follows the repository name, so renaming the repository never breaks the site.
      - name: Build Angular
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      # Public pages are prerendered (index.html, projects/index.html, ...). Routes rendered
      # only in the browser (login, admin, unknown URLs) are served by 404.html = the CSR shell.
      - name: Prepare GitHub Pages
        run: |
          cp "$DIST/index.csr.html" "$DIST/404.html"

      - name: Verify static assets and prerendered pages
        run: |
          for page in index.html projects/index.html about/index.html contact/index.html privacy/index.html; do
            test -f "$DIST/$page"
            grep -q '<h1' "$DIST/$page"
          done
          test -f "$DIST/404.html"
          test -f "$DIST/sitemap.xml"
          test -f "$DIST/robots.txt"
          test -f "$DIST/curriculo.pdf"
          test -f "$DIST/assets/images/perfil_foto.jpeg"
          test -f "$DIST/assets/images/og-card.png"
          test -f "$DIST/assets/images/blueprints/cutaway-1931.webp"
          test -f "$DIST/assets/images/blueprints/chassis.webp"
          test -f "$DIST/assets/images/blueprints/patent-1900.webp"
          test -f "$DIST/assets/images/blueprints/vehicle_management_02.webp"
          test -f "$DIST/assets/images/blueprints/patent-pendency-pt.svg"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
