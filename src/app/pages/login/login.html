<section class="login-page graph-paper" aria-labelledby="login-title">
  <div class="login-card">
    <p class="mono-label">{{ t.eyebrow }}</p>
    <h1 id="login-title">{{ t.title }}</h1>
    <p class="intro">{{ t.intro }}</p>

    @if (errorMessage()) {
      <p id="login-error" class="form-error" role="alert">{{ errorMessage() }}</p>
    }

    <form class="login-form" (ngSubmit)="login()" novalidate>
      <div class="field">
        <label for="email">{{ t.email }}</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="credentials.email"
          [disabled]="isLoading()"
          autocomplete="email"
          required
          [attr.aria-describedby]="errorMessage() ? 'login-error' : null"
        />
      </div>

      <div class="field">
        <label for="password">{{ t.password }}</label>
        <div class="password-row">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            [(ngModel)]="credentials.password"
            [disabled]="isLoading()"
            autocomplete="current-password"
            required
            [attr.aria-describedby]="errorMessage() ? 'login-error' : null"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            [attr.aria-pressed]="showPassword()"
            [disabled]="isLoading()"
          >{{ t.showPassword }}</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="isLoading()">
        {{ isLoading() ? t.loading : t.submit }}
      </button>
    </form>

    <p class="login-footer">{{ t.footer }}</p>
  </div>
</section>
