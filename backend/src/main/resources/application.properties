# Server (Render and similar hosts set PORT and sit behind a proxy)
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.application.name=portfolio-backend

# Database: in-memory H2 by default (data lost on restart). In production set
# DATABASE_URL=jdbc:postgresql://host:5432/db, DATABASE_USER, DATABASE_PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Security (see README): origins allowed to call the API, JWT key, the admin account
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tiagorodrigues-gith.github.io,http://localhost:4200}
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:120}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:}

# Visitor reviews: projects that accept them (keys used by the site) and submissions per address per hour
app.reviews.projects=${REVIEW_PROJECTS:defect-triage,patent-assistant,street-routing,vehicle-management,car-collectors}
app.reviews.max-per-hour=${REVIEW_MAX_PER_HOUR:5}

# Visit statistics (LGPD): records with IP addresses are deleted after this many days
app.analytics.retention-days=${ANALYTICS_RETENTION_DAYS:90}

# Contact form: messages per address per hour, and days a message (name, e-mail, text) is kept (LGPD)
app.contact.max-per-hour=${CONTACT_MAX_PER_HOUR:3}
app.contact.retention-days=${CONTACT_RETENTION_DAYS:365}

# Optional e-mail alerts (new message, new comment) through Resend's free plan; off while either is empty.
# NOTIFY_EMAIL must be the address of the Resend account unless a domain is verified there.
app.notify.resend-api-key=${RESEND_API_KEY:}
app.notify.to=${NOTIFY_EMAIL:}
app.notify.from=${NOTIFY_FROM:Portfolio <onboarding@resend.dev>}

logging.level.org.springframework.web=INFO
