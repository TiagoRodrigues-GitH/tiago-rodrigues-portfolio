# Local development profile: PostgreSQL in Docker instead of in-memory H2.
# Activate with -Dspring-boot.run.profiles=dev (or SPRING_PROFILES_ACTIVE=dev).
# Values come from environment variables; no password is stored in this file.
spring.datasource.url=${PORTFOLIO_DB_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${PORTFOLIO_DB_USER:portfolio}
spring.datasource.password=${PORTFOLIO_DB_PASSWORD:}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local site (ng serve) only
app.cors.allowed-origins=http://localhost:4200
